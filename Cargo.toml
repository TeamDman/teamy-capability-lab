[package]
name = "teamy-capability-lab"
default-run = "teamy-capability-lab"
version = "0.1.0"
edition = "2024"
authors = ["TeamDman"]
description = "Offline capability and transfer planning experiment"
license = "MPL-2.0"
readme = "README.md"

keywords = ["cli", "planning"]
categories = ["command-line-utilities"]

[package.metadata.relax]
git = "https://github.com/TeamDman/makepad.git"
rev = "79f54340fb239f612bb6634a4be3b3e6303995a5"

[dependencies]
linkme = "0.3.36"
scryer-prolog = { version = "=0.10.0", default-features = false }
cloud_terrastodon_registry = { git = "https://github.com/aafc-cloud/Cloud-Terrastodon/", rev = "fd989bd357cbfc5d60ad06aff2a7677a3a46491f" }
cloud_terrastodon_excalidraw = { git = "https://github.com/aafc-cloud/Cloud-Terrastodon/", rev = "fd989bd357cbfc5d60ad06aff2a7677a3a46491f" }
arbitrary = { version = "1.4.1", features = ["derive"] }
chrono = "0.4"
color-eyre = "0.6.5"
eyre = "0.6.12"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
teamy-tracing = "=0.2.0"
tracing-tracy = { version = "0.11", optional = true, default-features = false, features = ["enable", "system-tracing", "context-switch-tracing", "sampling", "code-transfer", "callstack-inlines", "only-localhost"] }
directories-next = "2"
tokio = { version = "1.49.0", features = ["full"] }
teamy-cancellation = { version = "=0.8.0", features = ["async", "figue", "arbitrary", "io"] }
facet = { package = "teamy-facet", version = "=0.50.0-rc.7", features = ["uuid", "compact_str", "chrono", "net"] }
facet-csv = { package = "teamy-facet-csv", version = "=0.50.0-rc.9" }
facet-json = { package = "teamy-facet-json", version = "=0.50.0-rc.9" }
facet-pretty = { package = "teamy-facet-pretty", version = "=0.50.0-rc.7" }
figue = { package = "teamy-figue", version = "=6.0.0-rc.5", features = ["arbitrary"] }
open = "5"
crossterm = { version = "0.29", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
unicode-width = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Globalization",
    "Win32_System_Console",
] }

[features]
default = []
inline-terminal = ["dep:crossterm", "dep:ratatui", "dep:unicode-width"]
ui-process = ["windows/Wdk_System_Threading", "windows/Win32_Foundation", "windows/Win32_Security", "windows/Win32_System_Kernel", "windows/Win32_System_Pipes", "windows/Win32_System_Threading"]
ui-process-fixtures = ["ui-process"]
windows-foundation = ["windows/Win32_Foundation", "windows/Win32_Graphics_Gdi", "windows/Win32_Security", "windows/Win32_System_LibraryLoader", "windows/Win32_System_Threading", "windows/Win32_UI_Shell", "windows/Win32_UI_WindowsAndMessaging"]
tracy = ["dep:tracing-tracy"]

[[example]]
name = "inline_pty_probe"
required-features = ["inline-terminal"]

[[example]]
name = "windows_tray_probe"
required-features = ["windows-foundation"]

[[bin]]
name = "ui-child-fixture"
path = "tests/support/ui_child_fixture.rs"
required-features = ["ui-process-fixtures"]

[build-dependencies]
embed-resource = { package = "teamy-embed-resource", version = "=0.1.0", default-features = false }

[lints.rust]
ambiguous_negative_literals = "warn"
unfulfilled_lint_expectations = "deny"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
# This local experiment has no hosted repository URL.
cargo_common_metadata = "allow"
disallowed_macros = "deny"
disallowed_methods = "deny"
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
multiple_crate_versions = "allow" # turn this off periodically to see how bad it has gotten :P
# nursery = { level = "warn", priority = -1 }  # optional, might cause more false positives
multiple_unsafe_ops_per_block = "deny"
module_inception = "allow"
allow_attributes = "deny"
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "allow" # facet macros use Unicode identifiers
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
